<html>
 <head>
  <title>
   Job Application
  </title>
  <style>
   body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            
            width: 100%;
            text-align: center;
            padding: 20px 0;
        }
        .header img {
            width: 350px;height:100px;
        }
        .header h1 {
            color: #EF5226;
            background-color: #FDEEE9;
            padding: 20px;
            font-size: 24px;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            width: 80%;
            max-width: 800px;
            margin: auto;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .section {
            margin-bottom: 20px;
        }
        .section h2 {
            
            background: var(--Foundation-techcloud-Secondary-techcloud-secondary-50, #E6F6FA);
            
            color: var(--Foundation-techcloud-Secondary-techcloud-secondary-900, #024656);
            padding: 10px;
            text-align: center;
            margin: 0;
        }
        .section table {
            width: 100%;
            border-top: var(--sds-size-stroke-border) solid #B9B9B9;
            border-left: var(--sds-size-stroke-border) solid #B9B9B9;
        }
        .section table, .section th, .section td {
            border: 1px solid #dddddd;
        }
        .section th, .section td {
            padding: 10px;
            text-align: left;
        }
        .section th {
            background-color: #ffffff;
            width: 25%;
        }

        @media only screen and (max-width: 600px) {
            .header img {
                width: 230px;height:80px;
            }
        }
  </style>
 </head>
 <body>
  
  <div class="container"><div class="header">
   <img alt="techcloud ERP logo" src="https://d3v0px0pttie1i.cloudfront.net/uploads/user/logo/36851129/325d486a.png"/>
   <h1>
    New Job Application Received!
   </h1>
  </div>
   <div class="section">
    <h2>
     Applicant Details
    </h2>
    <table>
     <tr>
      <th>
       Name
      </th>
      <td>
       {{fullName}}
      </td>
     </tr>
     <tr>
      <th>
       Email
      </th>
      <td>
       {{email}}
      </td>
     </tr>
     <tr>
      <th>
       Phone number
      </th>
      <td>
       {{phone}}
      </td>
     </tr>
     <tr>
      <th>
       Education level
      </th>
      <td>
       {{education}}
      </td>
     </tr>
     <tr>
      <th>
       Applied for
      </th>
      <td>
       {{AppliedRole}}
      </td>
     </tr><tr>
      <th>
       Total Years of Exp
      </th>
      <td>
       {{totalExperience}} Yrs
      </td>
     </tr>
    </table>
   </div>
   <div class="section">
    <h2>
     Salary Details
    </h2>
    <table>
     <tr>
      <th>
       Current Salary
      </th>
      <td>
       {{currentCTC}} LPA
      </td>
     </tr>
     <tr>
      <th>
       Expected Salary 
      </th>
      <td>
       {{expectedCTC}} LPA
      </td>
     </tr>
    </table>
   </div>
  </div>
 </body>
</html>
